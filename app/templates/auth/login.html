{% extends "base.html" %}
{% block content %}
<div class="row min-vh-60 align-items-center justify-content-center">
    <div class="col-lg-10">
        <div class="card overflow-hidden border-0 shadow-lg" style="background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px);">
            <div class="row g-0">
                <!-- Left Side: Visuals -->
                <div class="col-lg-6 d-none d-lg-flex flex-column align-items-center justify-content-center p-5 text-center text-white position-relative overflow-hidden" style="background: linear-gradient(135deg, #4f46e5 0%, #818cf8 100%);">
                    <!-- Abstract Background Shapes -->
                    <div style="position: absolute; width: 300px; height: 300px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.2); top: -50px; left: -50px;"></div>
                    <div style="position: absolute; width: 400px; height: 400px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.1); bottom: -100px; right: -100px;"></div>
                    
                    <div class="position-relative z-1">
                        <i class="bi bi-shield-lock-fill display-1 mb-3 text-white-50"></i>
                        <h2 class="fw-bold mb-2">Welcome Back!</h2>
                        <p class="mb-4 text-white-50">Enter your credentials to access your dashboard.</p>
                    </div>
                </div>

                <!-- Right Side: Form -->
                <div class="col-lg-6 p-5">
                    <div class="d-flex align-items-center mb-4">
                        <i class="bi bi-box-arrow-in-right text-primary fs-3 me-2"></i>
                        <h3 class="fw-bold m-0">Login</h3>
                    </div>
                    
                    <form method="POST">
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                                <input type="email" name="email" class="form-control border-start-0 ps-0 bg-white" placeholder="name@example.com" required>
                            </div>
                        </div>
                        <div class="mb-4">
                            <label class="form-label text-muted small fw-bold text-uppercase">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-key"></i></span>
                                <input type="password" name="password" class="form-control border-start-0 ps-0 bg-white" placeholder="••••••••" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between align-items-center mb-4">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="rememberMe">
                                <label class="form-check-label small text-muted" for="rememberMe">Remember me</label>
                            </div>
                            <a href="#" class="small text-primary text-decoration-none">Forgot password?</a>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 btn-lg mb-3 shadow-sm">
                            Sign In <i class="bi bi-arrow-right-short"></i>
                        </button>
                        
                        <div class="text-center mt-4">
                            <p class="small text-muted mb-0">Don't have an account?</p>
                            <a href="{{ url_for('auth.register') }}" class="fw-bold text-primary text-decoration-none">Create New Account</a>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
