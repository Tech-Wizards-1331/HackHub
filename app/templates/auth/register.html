{% extends "base.html" %}
{% block content %}
<div class="w-100 flex justify-center py-10">
    <div class="w-100" style="max-width: 1040px;">
        <div class="hh-glass overflow-hidden">
            <div class="row g-0">
                 <!-- Form -->
                 <div class="col-12 col-xl-7 p-4 p-sm-5 order-2 order-xl-1">
                    <div class="d-flex align-items-start justify-content-between gap-3 mb-4">
                        <div class="d-flex align-items-center gap-2">
                            <div class="w-10 h-10 rounded-2xl flex items-center justify-content-center" style="background: rgba(124,58,237,0.16); border: 1px solid rgba(124,58,237,0.22);">
                                <i class="bi bi-person-plus"></i>
                            </div>
                            <div>
                                <div class="fw-bold" style="font-size: 1.25rem;">Create Account</div>
                                <div class="hh-muted" style="font-size: 0.92rem;">Choose your role and set up your profile.</div>
                            </div>
                        </div>
                    </div>

                    <form method="POST" class="grid gap-3" style="max-width: 640px;">
                        <div class="row g-3">
                            <div class="col-md-6">
                                <label class="form-label mb-1" style="font-weight: 600;">Username</label>
                                <input type="text" name="username" class="form-control" placeholder="jdoe" required>
                            </div>
                            <div class="col-md-6">
                                <label class="form-label mb-1" style="font-weight: 600;">Full Name</label>
                                <input type="text" name="full_name" class="form-control" placeholder="John Doe" required>
                            </div>
                        </div>

                        <div>
                            <label class="form-label mb-1" style="font-weight: 600;">Email</label>
                            <input type="email" name="email" class="form-control" placeholder="john@example.com" required>
                        </div>

                        <div>
                            <label class="form-label mb-2" style="font-weight: 600;">I am a...</label>
                            <div class="row g-2">
                                <div class="col-12 col-sm-4">
                                    <div class="form-check card-radio h-100">
                                        <input class="form-check-input d-none" type="radio" name="role" id="roleParticipant" value="participant" checked>
                                        <label class="hh-card hh-card-hover p-3 text-center user-select-none h-100" for="roleParticipant" style="cursor: pointer;">
                                            <i class="bi bi-code-slash" style="color: var(--hh-brand); font-size: 1.35rem;"></i>
                                            <div class="mt-2 fw-bold" style="font-size: 0.98rem;">Participant</div>
                                            <div class="hh-muted" style="font-size: 0.85rem;">Join a team & compete</div>
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <div class="form-check card-radio h-100">
                                        <input class="form-check-input d-none" type="radio" name="role" id="roleFaculty" value="faculty">
                                        <label class="hh-card hh-card-hover p-3 text-center user-select-none h-100" for="roleFaculty" style="cursor: pointer;">
                                            <i class="bi bi-easel" style="color: var(--hh-brand-2); font-size: 1.35rem;"></i>
                                            <div class="mt-2 fw-bold" style="font-size: 0.98rem;">Faculty</div>
                                            <div class="hh-muted" style="font-size: 0.85rem;">Evaluate & scan QR</div>
                                        </label>
                                    </div>
                                </div>
                                <div class="col-12 col-sm-4">
                                    <div class="form-check card-radio h-100">
                                        <input class="form-check-input d-none" type="radio" name="role" id="roleAdmin" value="admin">
                                        <label class="hh-card hh-card-hover p-3 text-center user-select-none h-100" for="roleAdmin" style="cursor: pointer;">
                                            <i class="bi bi-shield-lock" style="color: var(--hh-danger); font-size: 1.35rem;"></i>
                                            <div class="mt-2 fw-bold" style="font-size: 0.98rem;">Admin</div>
                                            <div class="hh-muted" style="font-size: 0.85rem;">Create & manage events</div>
                                        </label>
                                    </div>
                                </div>
                            </div>
                            <style>
                                .card-radio input:checked + label {
                                    border-color: rgba(124, 58, 237, 0.55) !important;
                                    box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.16);
                                    background: rgba(124, 58, 237, 0.08);
                                }
                            </style>
                        </div>

                        <!-- Skills Field (Participant Only) -->
                        <div class="mb-3" id="skillsField" style="display: none;">
                            <label class="form-label mb-2" style="font-weight: 600;">
                                Technical Skills <span style="color: var(--hh-danger);">*</span>
                                <span class="hh-muted" style="font-weight: 400; font-size: 0.9rem;">(Select all that apply)</span>
                            </label>
                            <div class="p-3" style="max-height: 200px; overflow-y: auto; background: rgba(255,255,255,0.04); border: 1px solid var(--hh-border); border-radius: 12px;">
                                <div class="row g-2">
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="Python" id="skillPython">
                                            <label class="form-check-label" for="skillPython">Python</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="Java" id="skillJava">
                                            <label class="form-check-label" for="skillJava">Java</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="C++" id="skillCpp">
                                            <label class="form-check-label" for="skillCpp">C++</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="JavaScript" id="skillJS">
                                            <label class="form-check-label" for="skillJS">JavaScript</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="HTML/CSS" id="skillHTML">
                                            <label class="form-check-label" for="skillHTML">HTML/CSS</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="React" id="skillReact">
                                            <label class="form-check-label" for="skillReact">React</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="Node.js" id="skillNode">
                                            <label class="form-check-label" for="skillNode">Node.js</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="Database (SQL/NoSQL)" id="skillDB">
                                            <label class="form-check-label" for="skillDB">Database (SQL/NoSQL)</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="Machine Learning" id="skillML">
                                            <label class="form-check-label" for="skillML">Machine Learning</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="AI/Deep Learning" id="skillAI">
                                            <label class="form-check-label" for="skillAI">AI/Deep Learning</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="Cloud (AWS/Azure/GCP)" id="skillCloud">
                                            <label class="form-check-label" for="skillCloud">Cloud (AWS/Azure/GCP)</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="Docker/Kubernetes" id="skillDocker">
                                            <label class="form-check-label" for="skillDocker">Docker/Kubernetes</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="Git/Version Control" id="skillGit">
                                            <label class="form-check-label" for="skillGit">Git/Version Control</label>
                                        </div>
                                    </div>
                                    <div class="col-md-6">
                                        <div class="form-check">
                                            <input class="form-check-input" type="checkbox" name="skills" value="Mobile Development" id="skillMobile">
                                            <label class="form-check-label" for="skillMobile">Mobile Development</label>
                                        </div>
                                    </div>
                                </div>
                            </div>
                            <div class="mt-2">
                                <input type="text" name="custom_skills" class="form-control" placeholder="Other skills (comma-separated): Flutter, Django, GraphQL">
                            </div>
                        </div>

                        <div>
                            <label class="form-label mb-1" style="font-weight: 600;">Password</label>
                            <input type="password" name="password" class="form-control" placeholder="Create a strong password" required>
                        </div>

                        <button type="submit" class="hh-btn hh-btn-primary w-100 justify-center" style="padding: 0.65rem 0.9rem;">
                            Get Started
                            <i class="bi bi-arrow-right-short"></i>
                        </button>

                        <div class="text-center pt-2">
                            <span class="hh-muted" style="font-size: 0.92rem;">Already have an account?</span>
                            <a href="{{ url_for('auth.login') }}" class="text-decoration-none" style="color: var(--hh-brand); font-weight: 700;">Login</a>
                        </div>
                    </form>
                </div>

                <script>
                    // Show/hide skills field based on role selection
                    document.addEventListener('DOMContentLoaded', function() {
                        const roleInputs = document.querySelectorAll('input[name="role"]');
                        const skillsField = document.getElementById('skillsField');
                        const skillCheckboxes = skillsField.querySelectorAll('input[type="checkbox"]');
                        
                        function toggleSkillsField() {
                            const selectedRole = document.querySelector('input[name="role"]:checked').value;
                            
                            if (selectedRole === 'participant') {
                                skillsField.style.display = 'block';
                                // Make skills required for participants
                                skillCheckboxes.forEach(cb => cb.setAttribute('data-required', 'true'));
                            } else {
                                skillsField.style.display = 'none';
                                // Remove required for other roles
                                skillCheckboxes.forEach(cb => {
                                    cb.removeAttribute('data-required');
                                    cb.checked = false; // Clear selections
                                });
                                document.querySelector('input[name="custom_skills"]').value = '';
                            }
                        }
                        
                        // Initial check
                        toggleSkillsField();
                        
                        // Add event listeners
                        roleInputs.forEach(input => {
                            input.addEventListener('change', toggleSkillsField);
                        });
                        
                        // Form validation for participant skills
                        document.querySelector('form').addEventListener('submit', function(e) {
                            const selectedRole = document.querySelector('input[name="role"]:checked').value;
                            
                            if (selectedRole === 'participant') {
                                const checkedSkills = Array.from(skillCheckboxes).some(cb => cb.checked);
                                const customSkills = document.querySelector('input[name="custom_skills"]').value.trim();
                                
                                if (!checkedSkills && !customSkills) {
                                    e.preventDefault();
                                    alert('Please select at least one skill or add custom skills.');
                                    skillsField.scrollIntoView({ behavior: 'smooth', block: 'center' });
                                }
                            }
                        });
                    });
                </script>

                <!-- Side panel (kept, but lighter + only on xl for balance) -->
                <div class="col-xl-5 d-none d-xl-flex flex-column align-items-center justify-content-center p-4 text-center text-white position-relative overflow-hidden order-1 order-xl-2" style="background: linear-gradient(135deg, rgba(124,58,237,0.95) 0%, rgba(99,102,241,0.85) 100%);">
                     <div style="position: absolute; width: 260px; height: 260px; border-radius: 50%; border: 1px solid rgba(255,255,255,0.18); top: -60px; right: -70px;"></div>
                     <div class="position-relative z-1" style="max-width: 22rem;">
                        <div class="mb-3" style="opacity: 0.75;"><i class="bi bi-rocket-takeoff-fill" style="font-size: 2.6rem;"></i></div>
                        <h2 class="fw-bold mb-2" style="font-size: 1.55rem;">Join HackHub</h2>
                        <p class="mb-3" style="opacity: 0.8; font-size: 0.95rem;">Set up your profile and get matched to the right hackathon flow.</p>
                        <ul class="list-unstyled text-start d-inline-block mb-0" style="font-size: 0.92rem; opacity: 0.92;">
                            <li class="mb-2"><i class="bi bi-check-circle-fill me-2"></i> Register for events</li>
                            <li class="mb-2"><i class="bi bi-check-circle-fill me-2"></i> Join teams faster</li>
                            <li class="mb-0"><i class="bi bi-check-circle-fill me-2"></i> Track evaluation</li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
