{% extends "base.html" %}
{% block content %}
<div class="flex flex-col lg:flex-row lg:items-end justify-between gap-3 mb-5">
    <div>
        <div class="flex items-center gap-2 mb-2">
            <span class="hh-badge hh-badge--success"><i class="bi bi-star-fill"></i> Leader tools</span>
            <span class="hh-badge hh-badge--neutral"><i class="bi bi-flag"></i> {{ hackathon.name }}</span>
        </div>
        <h2 class="text-2xl sm:text-3xl font-semibold tracking-tight">Find members for {{ team.name }}</h2>
        <div class="hh-muted mt-1">Search solo participants and add them to your team.</div>
    </div>
    <div class="flex items-center gap-2">
        <a class="hh-btn" href="{{ url_for('participant.view_team', team_id=team.id) }}"><i class="bi bi-arrow-left"></i> Back to team</a>
    </div>
</div>

<div class="hh-card hh-card-hover mb-4">
    <div class="p-4 border-b" style="border-color: var(--hh-border);">
        <div class="text-sm hh-muted">Filters</div>
        <div class="text-lg font-semibold"><i class="bi bi-funnel me-2"></i>Skills</div>
    </div>
    <div class="p-4">
        <label class="hh-muted text-sm">Enter skills</label>
        <div class="flex flex-col sm:flex-row gap-2 mt-2">
            <input type="text" id="skillFilter" class="hh-input" placeholder="e.g., Frontend, Backend, AI/ML">
            <button type="button" class="hh-btn hh-btn-primary" onclick="loadParticipants()"><i class="bi bi-search"></i> Search</button>
            <button type="button" class="hh-btn" onclick="document.getElementById('skillFilter').value=''; loadParticipants()"><i class="bi bi-x-circle"></i> Clear</button>
        </div>
        <div class="hh-muted text-sm mt-3">Tip: try a single skill keyword for best results.</div>
    </div>
</div>

<div class="hh-card hh-card-hover">
    <div class="p-4 border-b" style="border-color: var(--hh-border);">
        <div class="text-sm hh-muted">Results</div>
        <div class="text-lg font-semibold"><i class="bi bi-person-lines-fill me-2"></i>Solo Participants</div>
    </div>
    <div class="p-4" id="participantsList">
        <div class="grid gap-3">
            <div class="hh-skeleton" style="height: 18px; width: 45%;"></div>
            <div class="hh-skeleton" style="height: 86px; width: 100%;"></div>
            <div class="hh-skeleton" style="height: 86px; width: 100%;"></div>
        </div>
    </div>
</div>

<script>
const hackathonId = {{ hackathon.id }};
const teamId = {{ team.id }};

function hhToast(msg, variant) {
    if (window.HackHubUI && typeof window.HackHubUI.toast === 'function') return window.HackHubUI.toast(msg, variant);
    if (variant === 'error' || variant === 'danger') return alert(msg);
    console.log(msg);
}

function loadParticipants() {
    const skillFilter = document.getElementById('skillFilter').value;
    const url = `/api/hackathon/${hackathonId}/solo_participants?skills=${encodeURIComponent(skillFilter)}`;
    
    fetch(url)
        .then(response => response.json())
        .then(data => {
            const container = document.getElementById('participantsList');
            
            if (data.participants && data.participants.length > 0) {
                let html = '<div class="grid gap-3">';
                data.participants.forEach(p => {
                    html += `
                        <div class="hh-card hh-card-hover p-4">
                            <div class="flex flex-col sm:flex-row sm:items-start justify-between gap-3">
                                <div class="min-w-0">
                                    <div class="font-semibold">${p.full_name || p.username}</div>
                                    <div class="hh-muted text-sm mt-1"><strong>Skills:</strong> ${p.skills || 'Not specified'}</div>
                                    <div class="hh-muted text-sm mt-1">Experience: ${p.experience_level || 'N/A'} • ${p.college || 'N/A'}</div>
                                </div>
                                <button class="hh-btn hh-btn-primary" onclick="addToTeam(${p.id}, '${(p.full_name || p.username).replace(/'/g, "\\'")}')">
                                    <i class="bi bi-person-plus"></i> Add
                                </button>
                            </div>
                        </div>
                    `;
                });
                html += '</div>';
                container.innerHTML = html;
            } else {
                container.innerHTML = '<div class="hh-muted">No solo participants found matching your criteria.</div>';
            }
        })
        .catch(error => {
            console.error('Error:', error);
            document.getElementById('participantsList').innerHTML = '<div class="hh-card p-4" style="border-color: rgba(239,68,68,0.35); background: rgba(239,68,68,0.10);">Error loading participants</div>';
            hhToast('Error loading participants', 'error');
        });
}

function addToTeam(participantId, name) {
    if (!confirm(`Add ${name} to your team?`)) return;
    hhToast('Adding member…', 'info');
    
    fetch(`/api/hackathon/${hackathonId}/team/${teamId}/add_member`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify({ participant_id: participantId })
    })
    .then(response => response.json())
    .then(data => {
        if (data.success) {
            hhToast(data.message || 'Join request sent!', 'success');
            loadParticipants(); // Refresh list
        } else {
            hhToast(data.error || 'Failed to add member', 'error');
        }
    })
    .catch(error => {
        console.error('Error:', error);
        hhToast('Error adding member', 'error');
    });
}

// Load on page load
loadParticipants();
</script>
{% endblock %}
