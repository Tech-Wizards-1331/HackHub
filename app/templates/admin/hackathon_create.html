{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-lg-8">
        <div class="card">
            <div class="card-header d-flex justify-content-between align-items-center">
                <h4 class="mb-0 fw-bold text-primary">Create New Hackathon</h4>
                <a href="{{ url_for('admin.dashboard') }}" class="btn btn-sm btn-outline-secondary">Cancel</a>
            </div>
            <div class="card-body p-4">
                <p class="text-muted mb-4">Fill in the details to launch a new event.</p>
                <form method="POST">
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase text-muted">Hackathon Name</label>
                        <input type="text" name="name" class="form-control form-control-lg" placeholder="e.g. Winter Code Fest 2024" required>
                    </div>
                    
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-uppercase text-muted">Description</label>
                        <textarea name="description" class="form-control" rows="4" placeholder="Brief description of the event..."></textarea>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-uppercase text-muted">Start Date & Time</label>
                            <input type="datetime-local" name="start_date" class="form-control">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-uppercase text-muted">Max Teams</label>
                            <input type="number" name="max_teams" class="form-control" value="50" min="1">
                        </div>
                    </div>

                    <div class="row mb-4">
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-uppercase text-muted">Min Team Size</label>
                            <input type="number" name="min_team_size" class="form-control" value="2" min="1">
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-bold small text-uppercase text-muted">Max Team Size</label>
                            <input type="number" name="max_team_size" class="form-control" value="4" min="1">
                        </div>
                    </div>
                    
                    <div class="d-grid gap-2 d-md-flex justify-content-md-end">
                        <button type="submit" class="btn btn-primary btn-lg px-5">Create Hackathon</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
